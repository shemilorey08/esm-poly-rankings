<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESM Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="brand">
            <img src="images/esm-logo.png" alt="ESM Logo">
            <span>ESM ADMIN</span>
        </div>
    </header>

    <main class="section">

        <div id="loginSection">
            <h1>Administrator Login</h1>
            <p>Sign in to manage ESM Poly Rankings.</p>

            <form id="adminLoginForm">
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Administrator email"
                    required
                >

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">Sign In</button>
                <p id="loginMessage"></p>
            </form>
        </div>

        <div id="dashboardSection" hidden>
            <h1>ESM Admin Dashboard</h1>
            <p>Welcome, <span id="adminName">Administrator</span>.</p>

            <div class="info-grid">
                <div class="info-card">
                    <h3>Polytechnics</h3>
                    <p>Manage institution records.</p>
                    <button id="managePolytechnics">Manage</button>
                </div>

                <div class="info-card">
                    <h3>Programmes</h3>
                    <p>Manage NBTE programme information.</p>
                    <button id="manageProgrammes">Manage</button>
                </div>

                <div class="info-card">
                    <h3>Rankings</h3>
                    <p>Create and update rankings.</p>
                    <button id="manageRankings">Manage</button>
                </div>

                <div class="info-card">
                    <h3>Articles</h3>
                    <p>Write and publish articles.</p>
                    <button id="manageArticles">Manage</button>
                </div>
            </div>

            <button id="adminLogout">Log Out</button>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
